---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: update-geolite-db
  namespace: envoy-gateway-system
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
spec:
  suspend: false
  schedule: 0 */2 * * *
  timeZone: Europe/Zurich
  failedJobsHistoryLimit: 3
  successfulJobsHistoryLimit: 1
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels:
            job: update-geolite-db
        spec:
          containers:
            - name: update-geolite-db
              image: ghcr.io/containeroo/alpine-toolbox:3.2.1
              envFrom:
                - secretRef:
                    name: maxmind-license
              command:
                - /bin/bash
                - -c
                - |
                  set -eu

                  echo "Updating MaxMind GeoLite databases"

                  update_database() {
                    local edition_id="$1"
                    local database_name="$2"
                    local database_path="/data/${database_name}.mmdb"
                    local modified_path="/data/.${database_name}.last-modified"
                    local download_url="https://download.maxmind.com/app/geoip_download?edition_id=${edition_id}&license_key=${MAXMIND_LICENSE_KEY}&suffix=tar.gz"
                    local work_dir
                    local headers_path
                    local archive_path
                    local remote_last_modified
                    local extracted_path

                    work_dir=$(mktemp -d)
                    headers_path="${work_dir}/headers"
                    archive_path="${work_dir}/database.tar.gz"

                    trap 'rm -rf "${work_dir}"' RETURN

                    echo "Checking ${edition_id} release date"
                    curl --fail --silent --show-error --location --head \
                      --output "${headers_path}" \
                      "${download_url}"

                    remote_last_modified=$(awk '
                      tolower($1) == "last-modified:" {
                        sub(/^[^:]*:[[:space:]]*/, "")
                        sub(/\r$/, "")
                        value = $0
                      }
                      END { print value }
                    ' "${headers_path}")

                    if [ -z "${remote_last_modified}" ]; then
                      echo "MaxMind response for ${edition_id} did not include Last-Modified"
                      return 1
                    fi

                    if [ -f "${database_path}" ] && \
                      [ -f "${modified_path}" ] && \
                      [ "$(cat "${modified_path}")" = "${remote_last_modified}" ]; then
                      echo "${edition_id} is already up to date"
                      return
                    fi

                    echo "Downloading ${edition_id} updated ${remote_last_modified}"
                    curl --fail --silent --show-error --location \
                      --output "${archive_path}" \
                      "${download_url}"

                    if ! tar -tzf "${archive_path}" >/dev/null; then
                      echo "MaxMind returned an invalid archive for ${edition_id}"
                      return 1
                    fi

                    tar -xzf "${archive_path}" -C "${work_dir}"
                    extracted_path=$(find "${work_dir}" -maxdepth 5 -name "${database_name}.mmdb" | head -n1 || true)

                    if [ -z "${extracted_path}" ]; then
                      echo "Could not find ${database_name}.mmdb in extracted archive"
                      return 1
                    fi

                    echo "Installing ${edition_id} to PVC"
                    cp "${extracted_path}" "${database_path}.tmp"
                    mv "${database_path}.tmp" "${database_path}"
                    printf '%s\n' "${remote_last_modified}" >"${modified_path}.tmp"
                    mv "${modified_path}.tmp" "${modified_path}"
                  }

                  update_database GeoLite2-City GeoLite2-City
                  update_database GeoLite2-ASN GeoLite2-ASN

                  echo "Done. GeoLite databases are up to date."
              volumeMounts:
                - name: maxmind-db
                  mountPath: /data
          restartPolicy: Never
          automountServiceAccountToken: false
          volumes:
            - name: maxmind-db
              persistentVolumeClaim:
                claimName: maxmind-geolite-db
